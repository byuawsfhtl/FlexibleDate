name: CI

on:
  pull_request:
    branches: [prd, dev]
    paths-ignore:
      - "**/README.md"
      - "**/.gitignore"
      - "**/docs/*"
      - "**/.github/*"

jobs:
  checkMeds:
    name: Check Meds (merge every day)
    runs-on: ubuntu-latest
    steps:
      - name: Check Meds
        uses: byuawsfhtl/MedsAction@v1.0.0

  checkStandard:
    name: Python Standard Check
    runs-on: ubuntu-latest
    steps:
      - name: Check Standard
        uses: byuawsfhtl/PythonStandardAction@v1.2.0

  checkTests:
    name: Test Coverage Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RLL_BOT_PA_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.RLL_BOT_PA_TOKEN }}
        run: |
          python -m pip install --upgrade pip
          pip install -r FlexibleDate/requirements.txt
          pip install -r FlexibleDate/requirements-dev.txt

      - name: Install npm dependencies
        run: |
          cd FlexibleDateTS
          npm install
          npm run build
          cd ..

      - name: Check Test Coverage
        uses: byuawsfhtl/TestCoverageAction@v1.0.0
        with:
          test_paths: tests/
          exclude_paths: FlexibleDateTS/, tests/, **/test_*.py, **/__init__.py, _version.py, setup.py
